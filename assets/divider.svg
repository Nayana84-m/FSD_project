<svg viewBox="0 0 400 20" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:0" />
      <stop offset="25%" style="stop-color:#14b8a6;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#14b8a6;stop-opacity:0.6" />
      <stop offset="75%" style="stop-color:#14b8a6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:0" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Gradient line with glow -->
  <line x1="0" y1="10" x2="400" y2="10" stroke="url(#dividerGrad)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Decorative dots -->
  <circle cx="50" cy="10" r="2" fill="#14b8a6" opacity="0.4"/>
  <circle cx="200" cy="10" r="2.5" fill="#14b8a6" opacity="0.6"/>
  <circle cx="350" cy="10" r="2" fill="#14b8a6" opacity="0.4"/>
</svg>
